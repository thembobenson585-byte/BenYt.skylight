<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0b142c;color:#fff;font-family:Arial;padding-bottom:20px} .top{padding:18px;text-align:center;font-weight:bold;background:#08101f} .card{margin:14px;background:#14233f;border-radius:18px;padding:16px;border:1px solid #1c335f} .big{font-size:28px;font-weight:bold} .green{color:#00ff88;font-size:26px;font-weight:bold} .dep{width:calc(100% - 28px);margin:0 14px;padding:14px;background:linear-gradient(90deg,#00c6ff,#7d3cf0);border:0;border-radius:12px;color:#fff;font-weight:bold} .claim{width:100%;padding:12px;background:transparent;border:1.5px solid #00a6d6;border-radius:12px;color:#00bfe6;font-weight:bold;margin-top:12px} .row{display:flex;justify-content:space-between;align-items:center;background:#0e1f3a;border-radius:12px;padding:12px;margin:8px 0} .dot{width:18px;height:18px;background:#00ff00;border-radius:50%;display:inline-block} .buy{padding:10px 22px;background:linear-gradient(90deg,#00bfff,#7d4cff);border:0;border-radius:10px;color:#fff;font-weight:bold}</style></head><body>
<div class="top">SKYLIGHT AI COMPANY</div>
<div class="card" style="display:flex;justify-content:space-between"><div><small>CAPITAL</small><div class="big" id="c">2,000 UGX</div></div><div style="text-align:right"><small>PROFITS 7%</small><div class="green" id="p">0 UGX</div></div></div>
<button class="dep" onclick="dep()">+ Deposit - 0793814204</button>
<div class="card"><b>⚡ My Real Machines - Lights LIVE</b><div id="m" style="color:#7f95b5;font-size:13px;margin-top:8px">No machines. Buy M1 to see lights</div><button class="claim" onclick="cl()">Claim Daily 7%</button><div style="margin-top:10px"><button onclick="resetAll()" style="background:none;border:none;color:#556a8a;font-size:11px">Reset / Fix NaN</button></div></div>
<div class="card"><b>🤖 Buy Real Machines - 7% DAILY - Lights ON</b>
<div class="row"><div><span class="dot"></span> M1 2,000 → 140/day</div><button class="buy" onclick="bu('M1',2000,140)">Buy</button></div>
<div class="row"><div><span class="dot"></span> U 5,000 → 350/day</div><button class="buy" onclick="bu('U',5000,350)">Buy</button></div>
<div class="row"><div><span class="dot"></span> L 15,000 → 1050/day</div><button class="buy" onclick="bu('L',15000,1050)">Buy</button></div>
<div class="row"><div><span class="dot"></span> Y 30,000 → 2100/day</div><button class="buy" onclick="bu('Y',30000,2100)">Buy</button></div>
</div>
<script>
function getNum(k,def){let v=localStorage.getItem(k);let n=parseInt(v);if(isNaN(n)) return def;return n;}
let cap=getNum('cap',2000); let prof=getNum('prof',0); let ms=[]; try{let raw=JSON.parse(localStorage.getItem('ms')||'[]'); ms=raw.filter(x=>x && (x.n||x.name)).map(x=>({n:x.n||x.name,d:x.d||x.daily||0}));}catch(e){ms=[];}
function up(){if(isNaN(cap)) cap=2000; if(isNaN(prof)) prof=0; document.getElementById('c').innerText=cap.toLocaleString()+' UGX'; document.getElementById('p').innerText=prof.toLocaleString()+' UGX'; let h=''; if(ms.length==0) h='No machines. Buy M1 to see lights'; else ms.forEach(x=>{let name=x.n||'M1'; h+='<div>🟢 '+name+' LIVE - Lights ON</div>';}); document.getElementById('m').innerHTML=h; localStorage.setItem('cap',cap); localStorage.setItem('prof',prof); localStorage.setItem('ms',JSON.stringify(ms));}
function bu(n,p,d){if(cap<p){alert('Deposit first! Need '+p+' UGX');return;}cap-=p; ms.push({n:n,d:d}); up(); alert(n+' bought! Lights ON 🟢');}
function cl(){if(ms.length==0){alert('Buy M1 first');return;}let t=0; ms.forEach(x=>t+=x.d); prof+=t; cap+=t; up(); alert('Claimed '+t+' UGX daily 7%!');}
function dep(){let a=prompt('Deposit amount:'); let num=parseInt(a); if(!num||isNaN(num)){return;} cap+=num; up(); alert('Deposited '+num+' UGX! Send proof to 0793814204');}
function resetAll(){localStorage.clear(); cap=2000; prof=0; ms=[]; up(); alert('Fixed! Now shows 2000 UGX');}
up();
if(isNaN(parseInt(localStorage.getItem('cap')))||document.body.innerHTML.includes('NaN')){localStorage.clear(); cap=2000; prof=0; ms=[]; up();}
</script></body></html>
