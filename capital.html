<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYLIGHT LOGIN</title>
<style>
body{margin:0;background:#0a1220;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#112040;width:90%;max-width:350px;padding:25px;border-radius:20px;border:2px solid #00d4ff;box-shadow:0 0 20px #00d4ff}
h2{text-align:center}
input{width:100%;padding:14px;margin:8px 0;background:#0a1830;border:1px solid #1e345e;border-radius:12px;color:white;box-sizing:border-box}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#00c6ff,#7d2ae8);border:none;border-radius:12px;color:white;font-weight:bold;margin-top:10px}
.links{display:flex;justify-content:space-between;margin-top:20px}
.links button{padding:10px;border-radius:8px;border:none;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>Login - Skylight AI Company</h2>
<p style="color:#8aa0c0;font-size:13px;text-align:center">If you registered before, click LOGIN now</p>
<input placeholder="Phone">
<input type="password" placeholder="Login Password">
<button class="btn" onclick="alert('Login Clicked - 7% LIVE')">LOGIN - 7% LIVE</button>
<p style="text-align:center;font-size:12px;margin-top:15px;color:#8aa0c0">No account? <b style="color:#00d4ff">REGISTER</b></p>

<div class="links">
<button style="background:gold" onclick="location.href='founders.html'">FOUNDERS</button>
<button style="background:cyan" onclick="location.href='official.html'">OFFICIAL</button>
<button style="background:#8a2be2;color:white" onclick="location.href='machines.html'">MACHINES</button>
</div>
</div>
</body>
</html>
