<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYLIGHT AI</title>
<style>
body{margin:0;background:#0a1220;font-family:Arial;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{background:#0f1e36;border:1px solid #1e345e;width:90%;max-width:380px;padding:25px;border-radius:20px}
h1{text-align:center;font-size:36px;background:linear-gradient(90deg,#00d4ff,#8a2be2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}
.sub{text-align:center;color:#8aa0c0;font-size:14px;margin:8px 0 20px 0}
label{font-size:18px;font-weight:bold}
.small{color:#8aa0c0;font-size:13px;margin:5px 0 15px 0}
input{width:100%;padding:16px;background:#060f20;border:1px solid #1e345e;border-radius:14px;color:white;font-size:18px;letter-spacing:5px;box-sizing:border-box}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,#00d4ff,#7d2ae8);border:none;border-radius:14px;color:white;font-weight:bold;font-size:16px;margin-top:15px;cursor:pointer}
.def{color:#8aa0c0;font-size:13px;margin-top:10px}
#dashboard{display:none;width:100%;min-height:100vh}
.top{padding:12px;display:flex;justify-content:space-between;background:#08101f}
.nav{display:flex;gap:8px;padding:12px;justify-content:center;flex-wrap:wrap}
.nav button{padding:10px 18px;border:none;border-radius:20px;font-weight:bold}
.box{margin:15px;border-radius:20px;padding:20px;border:2px solid gold;box-shadow:0 0 20px rgba(255,215,0,0.4);text-align:center;background:#112040}
</style>
</head>
<body>

<!-- FIRST PAGE - ACCESS CODE - LIKE PHOTO -->
<div id="lock" class="card">
<h1>SKYLIGHT AI</h1>
<p class="sub">AI Mining Machines • 3% Monthly</p>

<div style="margin-top:20px">
<label>Enter Access Code</label>
<p class="small">Password required before inside</p>
<input id="code" type="password" value="......" placeholder="......">
<button class="btn" onclick="unlock()">UNLOCK DASHBOARD</button>
<p class="def">Default: skylight123</p>
</div>
</div>

<!-- AFTER UNLOCK - YOUR HOMEPAGE v=7 -->
<div id="dashboard">
<div class="top"><b style="color:#00d4ff">SKYLIGHT AI COMPANY</b><span style="color:#00ff88;font-size:12px">● AI LIVE 7%</span></div>
<div class="nav">
<button style="background:white">LOGIN</button>
<button style="background:gold">FOUNDERS</button>
<button style="background:cyan">OFFICIAL GROUP</button>
<button style="background:#9d4edd;color:white">MACHINES</button>
</div>
<div class="box">
<h2>👑 VERIFIED FOUNDER</h2>
<p><b>0793814204</b></p>
<div style="text-align:left;background:rgba(0,0,0,0.5);padding:15px;border-radius:12px;margin:15px 0">
<p>Inside Founders People:</p>
<p>• Vision & Growth Strategy</p>
<p>• Community Leadership</p>
</div>
<p style="color:gold">✓ VERIFIED FOUNDER</p>
</div>
</div>

<script>
function unlock(){
let c=document.getElementById('code').value;
if(c==='skylight123' || c==='......' || c===''){
document.getElementById('lock').style.display='none';
document.getElementById('dashboard').style.display='block';
document.body.style.display='block';
}else{alert('Wrong code! Default: skylight123');}
}
</script>

</body>
</html>
