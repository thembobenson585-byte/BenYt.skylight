<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYLIGHT AI COMPANY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b142c;color:white;font-family:Arial;padding-bottom:80px}
.top{padding:18px;text-align:center;font-weight:bold;letter-spacing:1px;background:#08101f}
.card{margin:14px;background:#14233f;border-radius:18px;padding:16px;border:1px solid #1c335f}
.cap-card{display:flex;justify-content:space-between;align-items:center}
.big{font-size:28px;font-weight:bold;margin:4px 0}
.green{color:#00ff88;font-size:26px;font-weight:bold}
.dep{width:100%;padding:14px;background:linear-gradient(90deg,#00c6ff,#7d3cf0);border:none;border-radius:12px;color:white;font-weight:bold;font-size:15px;margin:2px 14px;width:calc(100% - 28px)}
.claim{width:100%;padding:13px;background:transparent;border:1.5px solid #00a6d6;border-radius:12px;color:#00bfe6;font-weight:bold;font-size:14px;margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:center;background:#0e1f3a;border-radius:12px;padding:12px 14px;margin:10px 0}
.dot{width:22px;height:22px;background:radial-gradient(#7dff7d,#00c000);border-radius:50%;display:inline-block;margin-right:8px;box-shadow:0 0 8px #00ff00}
.buy{padding:10px 24px;background:linear-gradient(90deg,#00bfff,#7d4cff);border:none;border-radius:10px;color:white;font-weight:bold}
.bot{position:fixed;bottom:0;left:0;right:0;background:#08101f;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #1c335f}
.bot button{background:none;border:none;color:#7f95b5;font-size:11px}
.on{color:#00d4ff!important}
.page{display:none}.show{display:block}
</style>
</head>
<body>
<div class="top">SKYLIGHT AI COMPANY</div>

<div id="home" class="page show">
