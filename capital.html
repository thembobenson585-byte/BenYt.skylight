er(localStorage.m||0);if(m==0){alert('Buy machine first!');return;}let earn=m*2;let p=Number(localStorage.pr||0)+earn;localStorage.pr=p;document.getElementById('pr').innerText=p+' UGX';alert('Claimed '+earn+' UGX')">Claim Daily Profit</button></div><div class="card"><p class="small">BUY MACHINE - START 2K</p><button class="btn" style="margin:6px 0" onclick="let cap=Number(localStorage.c||0);if(cap>=2000){localStorage.c=cap-2000;localStorage.m=Number(localStorage.m||0)+1;alert('Bought Starter 2K Machine!');location.reload()}else{alert('Need 2000 UGX capital')}">AI Starter - 2000 UGX</button><button class="btn" style="margin:6px 0" onclick="let cap=Number(localStorage.c||0);if(cap>=5000){localStorage.c=cap-5000;localStorage.m=Number(localStorage.m||0)+2.5;alert('Bought Lite 5K!');location.reload()}else{alert('Need 5000')}">AI Lite - 5000 UGX</button><button class="btn" style="margin:6px 0" onclick="let cap=Number(localStorage.c||0);if(cap>=20000){localStorage.c=cap-20000;localStorage.m=Number(localStorage.m||0)+10;alert('Bought Pro 20K!');location.reload()}else{alert('Need 20000')}">AI Pro - 20000 UGX</button></div><div class="card"><button class="btn" style="background:#00c853" onclick="let p=localStorage.pr||0;let n=prompt('MTN Number to withdraw '+p+' UGX');if(n)alert('Request sent to '+n+' - Pay manually via MoMo')">Withdraw to MoMo</button></div></div><script>let c=localStorage.c||0;let pr=localStorage.pr||0;let m=localStorage.m||0;if(document.getElementById('c'))document.getElementById('c').innerText=c+' UGX';if(document.getElementById('pr'))document.getElementById('pr').innerText=pr+' UGX';if(document.getElementById('machInfo'))document.getElementById('machInfo').innerText=m+' Machines active';</script></body></html>
