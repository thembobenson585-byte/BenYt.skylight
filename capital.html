<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0b142c;color:#fff;font-family:Arial} .top{padding:18px;text-align:center;font-weight:bold;background:#08101f} .card{margin:14px;background:#14233f;border-radius:18px;padding:16px;border:1px solid #1c335f} .big{font-size:28px;font-weight:bold} .green{color:#00ff88;font-size:26px;font-weight:bold} .dep{width:calc(100% - 28px);margin:0 14px;padding:14px;background:linear-gradient(90deg,#00c6ff,#7d3cf0);border:0;border-radius:12px;color:#fff;font-weight:bold} .claim{width:100%;padding:12px;background:transparent;border:1.5px solid #00a6d6;border-radius:12px;color:#00bfe6;font-weight:bold;margin-top:12px} .row{display:flex;justify-content:space-between;align-items:center;background:#0e1f3a;border-radius:12px;padding:12px;margin:8px 0} .dot{width:18px;height:18px;background:#00ff00;border-radius:50%;display:inline-block} .buy{padding:10px 22px;background:linear-gradient(90deg,#00bfff,#7d4cff);border:0;border-radius:10px;color:#fff;font-weight:bold}</style></head><body>
<div class="top">SKYLIGHT AI COMPANY</div>
<div class="card" style="display:flex;justify-content:space-between"><div><small>CAPITAL</small><div class="big" id="c">2,000 UGX</div></div><div style="text-align:right"><small>PROFITS 7%</small><div class="green" id="p">0 UGX</div></div></div>
<button class="dep" onclick="dep()">+ Deposit - 0793814204</button>
<div class="card"><b>⚡ My Real Machines - Lights LIVE</b><div id="m" style="color:#7f95b5;font-size:13px;margin-top:6px">No machines. Buy M1 to see lights</div><button class="claim" onclick="cl()">Claim Daily 7%</button></div>
<div class="card"><b>🤖 Buy Real Machines - 7% DAILY - Lights ON</b>
<div class="row"><div><span class="dot"></span> M1 2,000 → 140/day</div><button class="buy" onclick="bu('M1',2000,140)">Buy</button></div>
<div class="row"><div><span class="dot"></span> U 5,000 → 350/day</div><button class="buy" onclick="bu('U',5000,350)">Buy</button></div>
<div class="row"><div><span class="dot"></span> L 15,000 → 1050/day</div><button class="buy" onclick="bu('L',15000,1050)">Buy</button></div>
<div class="row"><div><span class="dot"></span> Y 30,000 → 2100/day</div><button class="buy" onclick="bu('Y',30000,2100)">Buy</button></div>
</div>
<script>
let cap=2000,prof=0,ms=[];let sc=localStorage;cap=parseInt(sc.getItem('cap')||2000);prof=parseInt(sc.getItem('prof')||0);ms=JSON.parse(sc.getItem('ms')||'[]');
function up(){document.getElementById('c').innerText=cap+' UGX';document.getElementById('p').innerText=prof+' UGX';let h='';if(ms.length==0)h='No machines. Buy M1 to see lights';else ms.forEach(x=>h+='🟢 '+x.n+' LIVE<br>');document.getElementById('m').innerHTML=h;sc.setItem('cap',cap);sc.setItem('prof',prof);sc.setItem('ms',JSON.stringify(ms));}
function bu(n,p,d){if(cap<p){alert('Deposit first');return;}cap-=p;ms.push({n:n,d:d});up();alert(n+' bought Lights ON!');}
function cl(){if(ms.length==0){alert('Buy M1 first');return;}let t=0;ms.forEach(x=>t+=x.d);prof+=t;cap+=t;up();alert('Claimed '+t+' UGX');}
function dep(){let a=prompt('Deposit amount:');if(a){cap+=parseInt(a);up();alert('Deposited! Send proof to 0793814204');}}up();
</script></body></html>
