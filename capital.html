<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYLIGHT AI COMPANY - OLD v7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{background:#070d1c;color:#fff;overflow:auto;height:auto}
body{padding-bottom:80px}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;background:#070d1c;position:sticky;top:0;z-index:10;border-bottom:1px solid #152749}
.top b{background:linear-gradient(90deg,#00d4ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:15px}
@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:0.5}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%{box-shadow:0 0 4px #22c55e}50%{box-shadow:0 0 14px #22c55e,0 0 20px #00d4ff}100%{box-shadow:0 0 4px #22c55e}}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:4px;animation:pulse 1.2s infinite}
.card{background:#101c33;border:1px solid #1b2c4d;border-radius:16px;margin:12px;padding:14px}
.sub{color:#6b84a8;font-size:12px;margin-top:6px;line-height:1.4}
.btn{width:100%;padding:11px;margin-top:10px;border-radius:20px;background:#0c1a30;border:1px solid #233a5c;color:#00b7ff;font-weight:bold}
.person{display:flex;align-items:center;background:#101c33;border:1px solid #1b2c4d;border-radius:14px;padding:11px;margin:9px 12px}
.person img{width:44px;height:44px;border-radius:50%;margin-right:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px}
.box{background:#101c33;border:1px solid #1b2c4d;border-radius:16px;padding:14px}
.box h2{margin:10px 0;font-size:22px}
.item{background:#0d1a30;border:1px solid #1b2c4d;border-radius:12px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.item.shine{border-color:#22c55e;animation:glow 2s infinite}
.buy{padding:8px 18px;border-radius:18px;background:#131f36;border:1px solid #2a415f;color:#fff;font-weight:bold}
.badge{background:#38bdf8;color:#000;font-size:9px;padding:3px 6px;border-radius:8px;margin-left:5px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a1322;border-top:1px solid #1b2c4d;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.bottom div{font-size:10px;text-align:center;color:#4a6490}
.bottom .on{color:#00d4ff}
/* LOGIN INSIDE - NOT FIXED - NO STUCK */
.login{border:2px solid #00d4ff}
.login input{width:100%;padding:11px;margin:7px 0;border-radius:12px;border:1px solid #1b2c4d;background:#070d1c;color:#fff}
.login button{width:100%;padding:12px;border-radius:20px;background:linear-gradient(90deg,#00d4ff,#7c3aed);border:none;color:#fff;font-weight:bold;font-size:15px;margin-top:8px}
</style>
</head>
<body>

<div class="top"><b>SKYLIGHT AI COMPANY</b><span style="color:#22c55e;font-size:12px">● AI LIVE 7%</span></div>
