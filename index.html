<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Block254 UG Snake</title>
<style>
body{margin:0;background:#0b3d20;color:white;text-align:center;font-family:Arial; -webkit-tap-highlight-color: transparent;}
canvas{border:4px solid #f5c542;background:#000;margin:10px auto;display:block;touch-action:none;border-radius:8px}
.btn{background:#f5c542;color:#000;padding:14px 30px;border-radius:10px;font-weight:bold;text-decoration:none;display:inline-block;margin:8px;border:none;font-size:16px;cursor:pointer}
.btn-green{background:#25D366;color:white;width:90%;max-width:320px}
.controls{display:grid;grid-template-columns:80px 80px 80px;grid-template-rows:60px 60px 60px;gap:10px;justify-content:center;margin:15px auto;}
.c-btn{background:rgba(255,255,255,0.15);border:2px solid #f5c542;color:#f5c542;font-size:28px;border-radius:12px;cursor:pointer;user-select:none}
.c-btn:active{background:#f5c542;color:black}
#up{grid-column:2;grid-row:1} #left{grid-column:1;grid-row:2} #down{grid-column:2;grid-row:2} #right{grid-column:3;grid-row:2}
#score{font-size:18px;margin:10px;font-weight:bold}
</style>
</head>
<body>
<h2 style="margin:10px 0">🐍 Block254 UG Snake</h2>
<p id="score">Score: 0 | Top: 0</p>
<canvas id="game" width="320" height="320"></canvas>

<button class="btn" onclick="startGame()">▶️ Play / Restart</button>

<!-- CONTROLS AT BOTTOM -->
<div class="controls">
<button class="c-btn" id="up" ontouchstart="setDir(0,-1)" onclick="setDir(0,-1)">▲</button>
<button class="c-btn" id="left" ontouchstart="setDir(-1,0)" onclick="setDir(-1,0)">◀</button>
<button class="c-btn" id="down" ontouchstart="setDir(0,1)" onclick="setDir(0,1)">▼</button>
<button class="c-btn" id="right" ontouchstart="setDir(1,0)" onclick="setDir(1,0)">▶</button>
</div>

<a class="btn btn-green" href="https://wa.me/256793814204?text=Hi%20Block254%20I%20support%20Snake%20with%201k%20for%20Gold%20skin">Support 1k Gold Skin — 0793814204</a>
<p style="font-size:12px;color:#ccc">Free to play. Tap buttons to move. Support optional.</p>

<script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
let snake,food,dir,score,gameLoop;let topScore=localStorage.getItem('top')||0;
document.getElementById('score').innerText=`Score: 0 | Top: ${topScore}`;
function startGame(){
 snake=[{x:160,y:160}];dir={x:16,y:0};food={x:80,y:80};score=0;
 document.getElementById('score').innerText=`Score: 0 | Top: ${topScore}`;
 clearInterval(gameLoop);gameLoop=setInterval(update,130);
}
function setDir(x,y){
 if(x!==0 && dir.x!==0) return; if(y!==0 && dir.y!==0) return;
 dir={x:x*16,y:y*16};
}
function update(){
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(head.x<0||head.x>=320||head.y<0||head.y>=320||snake.some(s=>s.x==head.x&&s.y==head.y)){
   clearInterval(gameLoop);
   if(score>topScore){topScore=score;localStorage.setItem('top',topScore);alert('NEW TOP! '+score+' Screenshot & send to 0793814204 for Gold skin');}
   else alert('Game Over! Score: '+score); return;
 }
 snake.unshift(head);
 if(head.x==food.x&&head.y==food.y){
   score+=10;document.getElementById('score').innerText=`Score: ${score} | Top: ${topScore}`;
   food={x:Math.floor(Math.random()*20)*16,y:Math.floor(Math.random()*20)*16};
 } else snake.pop();
 ctx.fillStyle='black';ctx.fillRect(0,0,320,320);
 ctx.fillStyle='#f5c542';ctx.shadowColor='#f5c542';ctx.shadowBlur=10;snake.forEach(s=>ctx.fillRect(s.x+1,s.y+1,14,14));ctx.shadowBlur=0;
 ctx.fillStyle='#ff3b3b';ctx.fillRect(food.x,food.y,14,14);
}
document.addEventListener('keydown',e=>{
 if(e.key=='ArrowUp')setDir(0,-1); if(e.key=='ArrowDown')setDir(0,1);
 if(e.key=='ArrowLeft')setDir(-1,0); if(e.key=='ArrowRight')setDir(1,0);
});
// swipe also
let sx,sy;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
canvas.addEventListener('touchend',e=>{
 let dx=e.changedTouches[0].clientX-sx;let dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>Math.abs(dy)){if(dx>0)setDir(1,0);else setDir(-1,0);} else{if(dy>0)setDir(0,1);else setDir(0,-1);}
});
startGame();
</script>
</body>
</html>
