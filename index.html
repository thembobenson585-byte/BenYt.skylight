<div class="top">

<div id="game" style="padding:15px">
<h2 style="color:#f5c542">Snake Gold Game</h2>
<canvas id="g" width="300" height="300"></canvas>
<div id="sc">Score: 0 | Best: 0</div>
<button onclick="restart()" style="padding:12px 18px;background:#f5c542;border:0;border-radius:10px;font-weight:bold;margin:5px">RESTART</button>
<button onclick="gold()" style="padding:12px 18px;background:#fff;border:0;border-radius:10px;font-weight:bold;margin:5px">GOLD CODE</button>
<p style="font-size:12px;color:#888">Swipe on game to move • Tap buttons</p>
</div>

<script>
let cv=document.getElementById('g'),ctx=cv.getContext('2d'),box=15,cols=20,rows=20,snake,dir={x:1,y:0},nd={x:1,y:0},food,score=0,best=localStorage.getItem('best')||0,goldOn=localStorage.getItem('gold')==='yes',loop,speed=110;
function newFood(){food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};if(snake&&snake.some(s=>s.x==food.x&&s.y==food.y))newFood();}
function restart(){snake=[{x:10,y:10}];dir={x:1,y:0};nd={x:1,y:0};score=0;newFood();clearInterval(loop);loop=setInterval(tick,speed);upd();}
function upd(){document.getElementById('sc').innerText=`Score: ${score} | Best: ${best} | ${goldOn?'GOLD ✨':'NORMAL'}`;}
function gold(){let c=prompt('Enter GOLD254 after 1k to 0793814204');if(c==='GOLD254'){localStorage.setItem('gold','yes');location.reload();}else if(c)alert('Wrong code');}
function go(x,y){if(x==-dir.x&&y==-dir.y)return;nd={x,y};}
function tick(){dir=nd;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0)h.x=cols-1;if(h.x>=cols)h.x=0;if(h.y<0)h.y=rows-1;if(h.y>=rows)h.y=0;if(snake.some(s=>s.x==h.x&&s.y==h.y)){clearInterval(loop);if(score>best){best=score;localStorage.setItem('best',best);}alert('Game Over: '+score);return;}snake.unshift(h);if(h.x==food.x&&h.y==food.y){score+=10;upd();newFood();}else snake.pop();ctx.fillStyle='#000';ctx.fillRect(0,0,300,300);ctx.fillStyle='red';ctx.fillRect(food.x*box+2,food.y*box+2,box-4,box-4);ctx.fillStyle=goldOn?'#f5c542':'#00ff88';if(goldOn){ctx.shadowColor='#f5c542';ctx.shadowBlur=10;}snake.forEach(s=>ctx.fillRect(s.x*box+1,s.y*box+1,box-2,box-2));ctx.shadowBlur=0;}
let sx,sy;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});cv.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>20)go(1,0);else if(dx<-20)go(-1,0);}else{if(dy>20)go(0,1);else if(dy<-20)go(0,-1);}});
restart();
</script>
<p style="color:#555;font-size:11px;padding:20px">Block254 UG © 2026</p>
