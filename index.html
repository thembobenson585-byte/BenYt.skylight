<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block254 Snake</title>
<style>
body{margin:0;background:#0b3d20;color:white;text-align:center;font-family:Arial}
canvas{border:4px solid #f5c542;background:black;margin:20px auto;display:block;touch-action:none}
.btn{background:#f5c542;color:black;padding:12px 24px;border-radius:8px;font-weight:bold;text-decoration:none;display:inline-block;margin:8px;border:none}
#score{font-size:20px}
</style>
</head>
<body>
<h1>🐍 Block254 UG Snake</h1>
<p id="score">Score: 0 | Top Score this week: 0</p>
<canvas id="game" width="320" height="320"></canvas>
<button class="btn" onclick="startGame()">Play / Restart</button><br>
<a class="btn" style="background:#25D366;color:white" href="https://wa.me/256793814204?text=Hi%20Block254%20I%20support%20Snake%20with%201k%20for%20Gold%20skin">Support 1k Gold Skin — 0793814204</a>
<p style="font-size:12px;color:#ccc">Free to play. Swipe to move. Support optional.</p>

<script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
let snake,food,dir,score,gameLoop;let topScore=localStorage.getItem('top')||0;
document.getElementById('score').innerText=`Score: 0 | Top: ${topScore}`;

function startGame(){
 snake=[{x:160,y:160}];dir={x:16,y:0};food={x:80,y:80};score=0;
 document.getElementById('score').innerText=`Score: 0 | Top: ${topScore}`;
 clearInterval(gameLoop);gameLoop=setInterval(update,120);
}
function update(){
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(head.x<0||head.x>=320||head.y<0||head.y>=320||snake.some(s=>s.x==head.x&&s.y==head.y)){
   clearInterval(gameLoop);
   if(score>topScore){topScore=score;localStorage.setItem('top',topScore);alert('NEW TOP SCORE: '+score+'! Screenshot & send to 0793814204');}
   else alert('Game Over! Score: '+score); return;
 }
 snake.unshift(head);
 if(head.x==food.x&&head.y==food.y){
   score+=10;document.getElementById('score').innerText=`Score: ${score} | Top: ${topScore}`;
   food={x:Math.floor(Math.random()*20)*16,y:Math.floor(Math.random()*20)*16};
 } else snake.pop();
 ctx.fillStyle='black';ctx.fillRect(0,0,320,320);
 ctx.fillStyle='#f5c542';snake.forEach(s=>ctx.fillRect(s.x,s.y,14,14));
 ctx.fillStyle='red';ctx.fillRect(food.x,food.y,14,14);
}
document.addEventListener('keydown',e=>{
 if(e.key=='ArrowUp'&&dir.y==0)dir={x:0,y:-16};
 if(e.key=='ArrowDown'&&dir.y==0)dir={x:0,y:16};
 if(e.key=='ArrowLeft'&&dir.x==0)dir={x:-16,y:0};
 if(e.key=='ArrowRight'&&dir.x==0)dir={x:16,y:0};
});
// swipe controls for phone
let sx,sy;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
canvas.addEventListener('touchend',e=>{
 let dx=e.changedTouches[0].clientX-sx;let dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x==0)dir={x:16,y:0};else if(dx<0&&dir.x==0)dir={x:-16,y:0};}
 else{if(dy>0&&dir.y==0)dir={x:0,y:16};else if(dy<0&&dir.y==0)dir={x:0,y:-16};}
});
</script>
</body>
</html>
